name: Atualizar blocklist

on:
  schedule:
    - cron: '17 5 * * *'   # todo dia, 02:17 em Brasilia
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sources.txt', 'allowlist.txt', 'build.ps1', '.github/workflows/update.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar lista
        shell: pwsh
        run: ./build.ps1

      - name: Commit se mudou
        run: |
          git add pihole_blocklist.txt
          if git diff --cached --quiet -I '^! Last modified' -- pihole_blocklist.txt; then
            echo "Nenhum dominio mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza blocklist $(date -u +%F)"
          git push
